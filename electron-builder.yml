appId: com.gcjang.daily-sidebar-planner
productName: Daily Sidebar Planner
directories:
  buildResources: resources
  output: dist-app
files:
  - out/**/*
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
# Outlook 일정 읽기 스크립트는 PowerShell이 **파일로** 실행해야 해서,
# asar 안이 아니라 리소스 폴더에 그대로 풀어 둬야 한다.
extraResources:
  - from: resources/outlook-calendar.ps1
    to: outlook-calendar.ps1
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: idontnowcode
  repo: Sidescheduler
  releaseType: release
